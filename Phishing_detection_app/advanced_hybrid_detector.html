<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ Advanced Hybrid Phishing Detector</title>

    <link rel="stylesheet" href="/static/advanced_hybrid_detector.css">
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <div class="header-content">

                <h1>🛡️ Advanced Hybrid Phishing Detector</h1>

                <p class="subtitle">
                    Rule-based + Random Forest + XGBoost + Stacking
                </p>

                <div class="tech-stack">
                    <span class="tech-badge">
                        🛡️ Rule-based Filtering
                    </span>

                    <span class="tech-badge">
                        🌳 Random Forest
                    </span>

                    <span class="tech-badge">
                        ⚡ XGBoost
                    </span>

                    <span class="tech-badge">
                        🔗 Logistic Regression Stacking
                    </span>
                </div>

            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">

            <!-- INPUT SECTION -->
            <div class="input-section">

                <label for="urlInput" class="input-label">
                    🔗 Enter URL for Advanced AI Analysis:
                </label>

                <!-- INPUT + HISTORY -->
                <div class="url-input-wrapper">

                    <input
                        type="text"
                        id="urlInput"
                        class="url-input"
                        placeholder="https://example.com or paste any suspicious URL here..."
                        autocomplete="off">

                    <div id="historyPopup" class="history-popup"></div>

                </div>

                <!-- MODE SELECT -->
                <div class="predict-controls">

                    <label for="modeSelect" class="prefilter-label">
                        🧪 Prediction Mode:
                    </label>

                    <select id="modeSelect" class="mode-select">

                        <option value="rf_only">
                            Random Forest
                        </option>

                        <option value="xgb_only">
                            XGBoost
                        </option>

                        <option value="ml_stacking_only">
                            ML + Stacking
                        </option>

                        <option value="hybrid_prefilter" selected>
                            Rule-Based + ML + Stacking
                        </option>

                    </select>

                </div>

                <!-- BUTTON -->
                <button
                    id="analyzeBtn"
                    class="analyze-btn"
                    onclick="analyzeURL()">

                    🔍 Check URL

                </button>

            </div>

            <!-- LOADING -->
            <div id="loading" class="loading">

                <div class="loading-spinner"></div>

                <p>
                    Analyzing URL with selected mode...
                </p>

            </div>

            <!-- RESULT -->
            <div id="result"></div>

        </div>

    </div>

    <script src="/static/advanced_hybrid_detector.js"></script>

</body>
</html>
